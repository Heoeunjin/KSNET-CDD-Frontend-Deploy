<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신분증 인증 - KSNET 고객확인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/module/progress.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="kyc-wrap">

    <!-- 헤더 -->
    <header class="kyc-header">
        <button class="btn-back" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
        </button>
        <span class="header-title">고객확인제도</span>
    </header>

    <!-- 진행 단계 -->
    <div class="progress-wrap">
        <div class="progress-steps">
            <div class="progress-step is-done">
                <div class="step-dot">✓</div>
                <div class="step-label">기본정보</div>
            </div>
            <div class="progress-step is-done">
                <div class="step-dot">✓</div>
                <div class="step-label">추가정보</div>
            </div>
            <div class="progress-step is-done">
                <div class="step-dot">✓</div>
                <div class="step-label">직업/목적</div>
            </div>
            <div class="progress-step is-active">
                <div class="step-dot">4</div>
                <div class="step-label">신분증</div>
            </div>
            <div class="progress-step">
                <div class="step-dot">5</div>
                <div class="step-label">계좌인증</div>
            </div>
        </div>
    </div>

    <!-- 본문 -->
    <div class="kyc-body">

        <div class="page-title">
            <h2>신분증 인증을 진행해주세요.</h2>
            <p>실제 정보와 일치하지 않으면 서비스 이용이 제한될 수 있습니다.</p>
        </div>

        <!-- 신분증 탭 -->
        <div class="tab-wrap">
            <div class="tab-item is-active" id="tabResident" onclick="switchTab('resident')">
                주민등록증
            </div>
            <div class="tab-item" id="tabLicense" onclick="switchTab('license')">
                운전면허증
            </div>
        </div>

        <!-- 주민등록증 폼 -->
        <div id="formResident">
            <form autocomplete="off">

                <!-- 이름 -->
                <div class="form-group">
                    <label class="form-label" for="inputResidentName">이름</label>
                    <div class="input-box" id="residentNameBox">
                        <input type="text"
                               id="inputResidentName"
                               placeholder="홍길동"
                               maxlength="10"
                               inputmode="text">
                    </div>
                    <p class="error-msg" id="residentNameError"></p>
                </div>

                <!-- 주민등록번호 -->
                <div class="form-group">
                    <label class="form-label">주민등록번호</label>
                    <div class="ssn-wrap">
                        <div class="input-box" id="residentSsnFrontBox">
                            <input type="text"
                                   id="inputResidentSsnFront"
                                   placeholder="123456"
                                   maxlength="6"
                                   inputmode="numeric">
                        </div>
                        <span class="ssn-dash">-</span>
                        <div class="input-box ssn-back-box" id="residentSsnBackBox">
                            <input type="text"
                                   id="inputResidentSsnBack"
                                   placeholder="●●●●●●●"
                                   maxlength="7"
                                   inputmode="numeric">
                        </div>
                    </div>
                    <p class="error-msg" id="residentSsnError"></p>
                </div>

                <!-- 발급일자 -->
                <div class="form-group">
                    <label class="form-label" for="inputResidentIssueDate">발급일자</label>
                    <div class="input-box" id="residentIssueDateBox">
                        <input type="text"
                               id="inputResidentIssueDate"
                               placeholder="YYYY.MM.DD"
                               maxlength="10"
                               inputmode="numeric">
                    </div>
                    <p class="error-msg" id="residentIssueDateError"></p>
                </div>

            </form>
        </div>

        <!-- 운전면허증 폼 -->
        <div id="formLicense" style="display:none;">
            <form autocomplete="off">

                <!-- 이름 -->
                <div class="form-group">
                    <label class="form-label" for="inputLicenseName">이름</label>
                    <div class="input-box" id="licenseNameBox">
                        <input type="text"
                               id="inputLicenseName"
                               placeholder="홍길동"
                               maxlength="10"
                               inputmode="text">
                    </div>
                    <p class="error-msg" id="licenseNameError"></p>
                </div>

                <!-- 주민등록번호 -->
                <div class="form-group">
                    <label class="form-label">주민등록번호</label>
                    <div class="ssn-wrap">
                        <div class="input-box" id="licenseSsnFrontBox">
                            <input type="text"
                                   id="inputLicenseSsnFront"
                                   placeholder="123456"
                                   maxlength="6"
                                   inputmode="numeric">
                        </div>
                        <span class="ssn-dash">-</span>
                        <div class="input-box ssn-back-box" id="licenseSsnBackBox">
                            <input type="text"
                                   id="inputLicenseSsnBack"
                                   placeholder="●●●●●●●"
                                   maxlength="7"
                                   inputmode="numeric">
                        </div>
                    </div>
                    <p class="error-msg" id="licenseSsnError"></p>
                </div>

                <!-- 면허번호 -->
                <div class="form-group">
                    <label class="form-label" for="inputLicenseNo">면허번호</label>
                    <div class="input-box" id="licenseNoBox">
                        <input type="text"
                               id="inputLicenseNo"
                               placeholder="00-00-000000-00"
                               maxlength="14"
                               inputmode="text">
                    </div>
                    <p class="error-msg" id="licenseNoError"></p>
                </div>

                <!-- 식별번호 -->
                <div class="form-group">
                    <label class="form-label" for="inputLicenseSerial">식별번호</label>
                    <div class="input-box" id="licenseSerialBox">
                        <input type="text"
                               id="inputLicenseSerial"
                               placeholder="000000"
                               maxlength="6"
                               inputmode="text">
                    </div>
                    <p class="error-msg" id="licenseSerialError"></p>
                </div>

            </form>
        </div>

    </div>

    <!-- 하단 버튼 -->
    <div class="bottom-btn-area">
        <button class="btn btn-primary" id="btnNext" disabled onclick="goNext()">
            다음
        </button>
    </div>

</div>

<!-- 신분증 인증 실패 모달 -->
<div class="modal-overlay" id="modalIdError">
    <div class="modal-box">
        <div class="modal-title">신분증 정보 불일치</div>
        <div class="modal-desc">신분증 정보가 일치하지 않습니다.<br>입력한 정보를 다시 확인해주세요.</div>
        <div class="modal-btns">
            <button class="btn btn-primary" onclick="KYC.closeModal('modalIdError')">확인</button>
        </div>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/module/validation.js"></script>
<script src="index.js"></script>
</body>
</html>
