name: Sync to Fork

on:
  push:
    branches: [develop]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 조직 레포
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to fork repo
        run: |
          git config user.name "Heoeunjin"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          # 기존 remote 삭제 후 다시 등록 (안전하게)
          git remote remove fork || true
          # 토큰을 직접 URL에 넣는 방식
          git remote add fork https://${{ secrets.FORK_DISPATCH_TOKEN }}@github.com/Heoeunjin/KSNET-CDD-Frontend.git
          # 강제 푸시
          git push fork develop --force