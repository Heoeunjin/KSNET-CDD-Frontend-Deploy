name: Notify Fork on Merge

on:
  pull_request:
    branches: [develop]
    types: [closed]

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send dispatch to fork repo
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.FORK_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/Heoeunjin/KSNET-CDD-Frontend/dispatches \
            -d '{"event_type": "upstream-merged"}'