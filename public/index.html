<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고객확인제도 - KSNET</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="kyc-wrap" id="main">

    <div class="main-inner">

        <!-- 로고 영역 -->
        <div class="main-logo-area">
            <div class="ksnet-logo">
                <img src="assets/images/ksnet-logo.png" alt="KSNET" width="120" height="36">
            </div>
            <p class="logo-sub">선불지갑</p>
        </div>

        <!-- 메인 카드 -->
        <div class="main-card main-card--intro">
            <h1 class="main-title">케이에스넷 선불지갑 사용을 위한<br>고객확인을 시작합니다.</h1>
            <p class="main-desc">본인 명의의 휴대폰과 신분증을 준비해 주세요.</p>

            <!-- 준비물 -->
            <div class="checklist">
                <div class="check-item">
                    <span class="check-icon">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M3 8l3.5 3.5L13 5" stroke="#1A4CC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span>본인 명의의 휴대폰</span>
                </div>
                <div class="check-item">
                    <span class="check-icon">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M3 8l3.5 3.5L13 5" stroke="#1A4CC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span>신분증 (주민등록증 또는 운전면허증)</span>
                </div>
                <div class="check-item">
                    <span class="check-icon">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M3 8l3.5 3.5L13 5" stroke="#1A4CC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span>본인 명의의 입출금 통장</span>
                </div>
            </div>
        </div>

        <!-- 버튼 영역 → 약관 동의 페이지로 이동 -->
        <div class="main-btns">
            <button class="btn btn-primary btn-lg" type="button" id="btnToAgreement" onclick="KYC.goTo('agreement/index.html')">
                고객확인하기
            </button>
            <button class="btn btn-text" onclick="KYC.goTo('intro/index.html')">
                고객확인제도란?
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

    </div>

</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="index.js"></script>
</body>
</html>
