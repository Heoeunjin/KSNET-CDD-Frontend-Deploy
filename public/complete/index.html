<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>고객확인 완료 - KSNET</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .complete-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            background: linear-gradient(160deg, #EBF0FB 0%, #FFFFFF 60%);
        }

        .complete-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(26, 76, 192, 0.3);
            animation: scaleIn 0.5s ease forwards;
        }

        @keyframes scaleIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .complete-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            text-align: center;
            margin-bottom: 12px;
            animation: fadeUp 0.5s ease 0.4s both;
        }

        .complete-desc {
            font-size: 15px;
            color: var(--text-sub);
            text-align: center;
            line-height: 1.7;
            margin-bottom: 40px;
            animation: fadeUp 0.5s ease 0.5s both;
        }

        .complete-desc strong {
            color: var(--primary);
            font-weight: 700;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .complete-info-card {
            width: 100%;
            background: var(--white);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 32px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            animation: fadeUp 0.5s ease 0.6s both;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
        }

        .info-label {
            font-size: 13px;
            color: var(--text-hint);
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .info-value.is-done {
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .complete-btn-area {
            width: 100%;
            animation: fadeUp 0.5s ease 0.7s both;
        }

        .complete-btn-area .btn-primary {
            height: 56px;
            font-size: 17px;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(26, 76, 192, 0.3);
        }

        .ksnet-badge {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-hint);
            text-align: center;
            animation: fadeUp 0.5s ease 0.8s both;
        }
    </style>
</head>
<body>

<div class="kyc-wrap">
    <div class="complete-wrap">

        <!-- 완료 아이콘 -->
        <div class="complete-icon" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
                <path d="M8 18.5L15.2 25.7L28 12.9" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- 완료 텍스트 -->
        <h1 class="complete-title">고객 확인이<br>완료되었습니다.</h1>
        <p class="complete-desc">
            케이에스넷 선불지갑 서비스를<br>
            <strong>안전하게 이용</strong>하실 수 있습니다.
        </p>

        <!-- 완료 내역 카드 -->
        <div class="complete-info-card">
            <div class="info-row">
                <span class="info-label">기본정보 확인</span>
                <span class="info-value is-done">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <circle cx="7" cy="7" r="7" fill="#00B84C"/>
                        <path d="M4 7L6.5 9.5L10 5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    완료
                </span>
            </div>
            <div class="info-row">
                <span class="info-label">신분증 인증</span>
                <span class="info-value is-done">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <circle cx="7" cy="7" r="7" fill="#00B84C"/>
                        <path d="M4 7L6.5 9.5L10 5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    완료
                </span>
            </div>
            <div class="info-row">
                <span class="info-label">계좌 인증</span>
                <span class="info-value is-done">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <circle cx="7" cy="7" r="7" fill="#00B84C"/>
                        <path d="M4 7L6.5 9.5L10 5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    완료
                </span>
            </div>
        </div>

        <!-- 버튼 -->
        <div class="complete-btn-area">
            <button class="btn btn-primary" onclick="goHome()">
                확인
            </button>
        </div>

        <p class="ksnet-badge">KSNET 선불지갑</p>

    </div>
</div>

<script src="../js/common.js"></script>
<script>
    (function onCompleteLoad() {
        if (typeof KYC !== 'undefined' && KYC.kycComplete()) {
            return;
        }
    })();

    function goHome() {
        const data = KYC.loadStep();
        if (data.kyc_callback_url && KYC.kycComplete()) return;
        sessionStorage.removeItem('kycData');
        KYC.goTo('../index.html');
    }
</script>
</body>
</html>
